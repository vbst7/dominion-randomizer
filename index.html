<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion Randomizer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./allCards.js"></script>
  <script src="./allMixes.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    // Lucide icons - destructure from the global lucide object
    const Settings = (props) => {
      return React.createElement('svg', {
        ...props,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      }, [
        React.createElement('path', { key: 1, d: "M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" }),
        React.createElement('circle', { key: 2, cx: "12", cy: "12", r: "3" })
      ]);
    };

    const X = (props) => {
      return React.createElement('svg', {
        ...props,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      }, [
        React.createElement('path', { key: 1, d: "M18 6 6 18" }),
        React.createElement('path', { key: 2, d: "m6 6 12 12" })
      ]);
    };

    const Menu = (props) => {
      return React.createElement('svg', {
        ...props,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      }, [
        React.createElement('line', { key: 1, x1: "4", x2: "20", y1: "12", y2: "12" }),
        React.createElement('line', { key: 2, x1: "4", x2: "20", y1: "6", y2: "6" }),
        React.createElement('line', { key: 3, x1: "4", x2: "20", y1: "18", y2: "18" })
      ]);
    };

    const PotionIcon = (props) => {
      return React.createElement('svg', {
        ...props,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      }, [
        React.createElement('path', { key: 1, d: "M10 2v8.5c0 .4.2.8.5 1.1L12 13l1.5-1.4c.3-.3.5-.7.5-1.1V2" }),
        React.createElement('path', { key: 2, d: "M8.5 2h7" }),
        React.createElement('path', { key: 3, d: "M12 13a4.5 4.5 0 0 0 4.5-4.5c0-2.5-2-4.5-4.5-4.5S7.5 6 7.5 8.5A4.5 4.5 0 0 0 12 13Z" })
      ]);
    };

    const HexagonIcon = (props) => {
      return React.createElement('svg', {
        ...props,
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "currentColor",
        stroke: "currentColor",
        strokeWidth: "1",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      }, [
        React.createElement('path', { key: 1, d: "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" })
      ]);
    };

    const App = () => {
    const allAvailableCards = window.dominionCards;
    const allAvailableAllies = window.dominionAllies;
    const allAvailableProphecies = window.dominionProphecies;
    const allAvailableLandscapes = window.dominionLandscapes;
    const allMixes = window.dominionMixes;
    const allSetNames = [...new Set(allAvailableCards.map(c => c.set))].sort();

    const [userConfig, setUserConfig] = useState({
        selectedSets: {},
        selectedOptions: {
            requireActions: false,
            requireDrawer: true,
            requireBuy: false,
            requireTrashing: false,
        },
        sortBy: 'cost',
        maxPoolLevel: 10,
        minPotion: 0,
        selectedMixes: {},
        minCardsBelowComplexity: 0,
        minComplexityLevel: 5,
    });
    const [kingdom, setKingdom] = useState([]);
    const [landscapes, setLandscapes] = useState([]);
    const [baneCard, setBaneCard] = useState(null);
    const [approachingArmyCard, setApproachingArmyCard] = useState(null);
    const [extraPiles, setExtraPiles] = useState([]);
    const [selectedItem, setSelectedItem] = useState(null);
    const [showSettings, setShowSettings] = useState(false);
    const [ownedSets, setOwnedSets] = useState({});
    const [bannedCards, setBannedCards] = useState({});
    const [showMobileMenu, setShowMobileMenu] = useState(false);

    const initialUserConfig = {
        selectedSets: {},
        selectedOptions: {
            requireActions: false,
            requireDrawer: true,
            requireBuy: false,
            requireTrashing: false,
        },
        sortBy: 'cost',
        maxPoolLevel: 10,
        minPotion: 0,
        assignedTraits: [],
        selectedMixes: {},
        minCardsBelowComplexity: 0,
        minComplexityLevel: 5,
    };

    // Destructure for easier access
    const { selectedSets, selectedOptions, sortBy, maxPoolLevel, minPotion, selectedMixes } = userConfig;

    // Load owned sets from localStorage on initial render
    useEffect(() => {
        const savedOwnedSets = localStorage.getItem('dominionOwnedSets');
        let initialOwnedSets;
        if (savedOwnedSets) {
            initialOwnedSets = JSON.parse(savedOwnedSets);
        } else {
            // Default to all sets owned, except for "Removed Cards" sets
            initialOwnedSets = allSetNames.reduce((acc, setName) => {
                acc[setName] = !setName.includes('Removed Cards');
                return acc;
            }, {});
        }
        setOwnedSets(initialOwnedSets);

        // Load main page config
        const savedUserConfig = localStorage.getItem('dominionUserConfig');
        if (savedUserConfig) {
            const loadedConfig = JSON.parse(savedUserConfig);
            // Merge with defaults to prevent errors from old configs
            setUserConfig({
                ...initialUserConfig,
                ...loadedConfig,
                selectedOptions: { ...initialUserConfig.selectedOptions, ...loadedConfig.selectedOptions }
            });
        } else {
            setUserConfig({ ...initialUserConfig, selectedSets: initialOwnedSets });
        }

        // Load banned cards
        const savedBannedCards = localStorage.getItem('dominionBannedCards');
        if (savedBannedCards) {
            setBannedCards(JSON.parse(savedBannedCards));
        }
    }, []);

    // Persist owned sets to localStorage whenever they change
    useEffect(() => {
        // Don't save the initial empty object
        if (Object.keys(ownedSets).length > 0) {
            localStorage.setItem('dominionOwnedSets', JSON.stringify(ownedSets));
        }
    }, [ownedSets]);

    // Persist main page config to localStorage whenever it changes
    useEffect(() => {
        localStorage.setItem('dominionUserConfig', JSON.stringify(userConfig));
    }, [userConfig]);

    // Persist banned cards to localStorage whenever they change
    useEffect(() => {
        localStorage.setItem('dominionBannedCards', JSON.stringify(bannedCards));
    }, [bannedCards]);

    const getCardBackground = (card) => {
        const types = [];
        if (card.isReaction) types.push('reaction');
        if (card.isDuration) types.push('duration');
        if (card.isVictory) types.push('victory');
        if (card.isAction && !card.isReaction && !card.isDuration) types.push('action');
        if (card.isNight) types.push('night');
        if (card.isTreasure) types.push('treasure');

        if (types.length === 0) return 'bg-gray-200';
        if (types.length === 1) {
        const colorMap = {
            action: 'bg-gray-200',
            treasure: 'bg-yellow-400',
            duration: 'bg-orange-400',
            reaction: 'bg-blue-400',
            victory: 'bg-green-400',
            night: 'bg-gray-600',
        };
        return colorMap[types[0]];
        }

        const gradientMap = {
        'action,treasure': 'bg-gradient-to-b from-gray-200 to-yellow-400',
        'action,duration': 'bg-orange-400',
        'action,reaction': 'bg-blue-400',
        'victory,action': 'bg-gradient-to-b from-gray-200 to-green-400',
        'victory,treasure': 'bg-gradient-to-b from-yellow-400 to-green-400',
        'victory,reaction': 'bg-gradient-to-b from-green-400 to-blue-400',
        'duration,treasure': 'bg-gradient-to-b from-yellow-400 to-orange-400',
        'duration,reaction': 'bg-gradient-to-b from-orange-400 to-blue-400',
        'reaction,treasure': 'bg-gradient-to-b from-yellow-400 to-blue-400',
        'action,night': 'bg-gradient-to-b from-gray-200 to-gray-600',
        'duration,night': 'bg-gradient-to-b from-orange-400 to-gray-600',
        };

        return gradientMap[types.join(',')] || 'bg-gray-200';
    };

    const getAvailablePool = () => {
        const activeSetNames = Object.keys(selectedSets).filter(setName => selectedSets[setName]);
        const activeMixNames = Object.keys(selectedMixes).filter(mixName => selectedMixes[mixName]);

        const cardsFromMixes = new Set();
        if (activeMixNames.length > 0) {
            allMixes.forEach(mix => {
                if (selectedMixes[mix.name]) {
                    mix.cards.forEach(cardName => cardsFromMixes.add(cardName));
                }
            });
        }

        const filterItem = (item) => {
            if (activeMixNames.length > 0 && !cardsFromMixes.has(item.name)) return false;
            if (activeSetNames.length > 0 && !activeSetNames.includes(item.set)) return false;
            if (item.poolLevel > maxPoolLevel) return false;
            if (bannedCards[item.name]) return false;
            if (activeSetNames.length === 0 && activeMixNames.length === 0) return false;
            return true;
        };

        const availableCards = allAvailableCards.filter(filterItem);
        const availableLandscapes = allAvailableLandscapes.filter(filterItem);
        // Filter Allies and Prophecies based on the same criteria, renaming for clarity in randomizeKingdom
        const potentialAllies = allAvailableAllies.filter(filterItem);
        const potentialProphecies = allAvailableProphecies.filter(filterItem);

        return {
            cards: availableCards,
            landscapes: availableLandscapes,
            allies: potentialAllies,
            prophecies: potentialProphecies,
        };
    };

    const handleSelectAllSets = () => {
        const allOwned = allSetNames
            .filter(setName => ownedSets[setName])
            .reduce((acc, setName) => ({ ...acc, [setName]: true }), {});
        setUserConfig(prev => ({ ...prev, selectedSets: allOwned }));
    };

    const handleDeselectAllSets = () => {
        setUserConfig(prev => ({ ...prev, selectedSets: {} }));
    };

    const handleSelectAllMixes = () => {
        const all = allMixes.reduce((acc, mix) => ({ ...acc, [mix.name]: true }), {});
        setUserConfig(prev => ({ ...prev, selectedMixes: all }));
    };

    const handleDeselectAllMixes = () => {
        setUserConfig(prev => ({ ...prev, selectedMixes: {} }));
    };

    const handleSelectAllOwned = () => {
        const all = allSetNames.reduce((acc, setName) => ({ ...acc, [setName]: true }), {});
        setOwnedSets(all);
    };

    const handleDeselectAllOwned = () => setOwnedSets({});

    const handleItemClick = (item) => {
        if (selectedItem?.name === item.name) {
            setSelectedItem(null); // Deselect if the same item is clicked again
        } else {
            setSelectedItem(item); // Select the new item
        }
    };

    const sortKingdom = (cards) => {
        const sorted = [...cards];

        const getEffectiveCost = (card) => (card.cost || 0) + (card.costPotion ? 0.5 : 0);
        
        if (sortBy === 'alphabetical') {
        sorted.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'cost') {
        sorted.sort((a, b) => {
            const costDiff = getEffectiveCost(b) - getEffectiveCost(a);
            if (costDiff !== 0) return costDiff;
            return a.name.localeCompare(b.name); // Secondary sort: alphabetical
        });
        } else if (sortBy === 'set') {
        // For set sorting, group by set (alphabetically) then use the previous sort as secondary
        sorted.sort((a, b) => {
            if (a.set !== b.set) {
                return a.set.localeCompare(b.set);
            }
            // Use the previous sort setting as the secondary sort
            const costDiff = getEffectiveCost(b) - getEffectiveCost(a);
            if (costDiff !== 0) return costDiff;
            return a.name.localeCompare(b.name);
        });
        }
        
        return sorted;
    };

    const randomizeKingdom = () => {
    // Destructure all necessary pools from getAvailablePool in one go
    const { cards: availableCards, landscapes: availableLandscapes, allies: potentialAllies, prophecies: potentialProphecies } = getAvailablePool();
    const combinedPool = [...availableCards, ...availableLandscapes];

    if (availableCards.length < 10) {
      alert(`Not enough kingdom cards available! Only ${availableCards.length} cards match your constraints. You need at least 10.`);
      return;
    }

    // Check complexity constraint feasibility
    if (userConfig.minCardsBelowComplexity > 0) {
        const matchingCards = availableCards.filter(c => (c.poolLevel || 1) <= userConfig.minComplexityLevel);
        if (matchingCards.length < userConfig.minCardsBelowComplexity) {
             alert(`Not enough cards with Complexity Level ${userConfig.minComplexityLevel} or lower! You requested at least ${userConfig.minCardsBelowComplexity}, but only ${matchingCards.length} are available with your current filters.`);
             return;
        }
    }

    // Initialize kingdom and landscape arrays
    let newKingdom = [];
    let newLandscapes = [];
    // Create a mutable pool for selection
    let remainingPool = [...combinedPool];
    
    // Shuffle the pool
    for (let i = remainingPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingPool[i], remainingPool[j]] = [remainingPool[j], remainingPool[i]];
    }

    // Pick cards and landscapes
    for (const item of remainingPool) {
        const isLandscape = allAvailableLandscapes.some(l => l.name === item.name);

        if (isLandscape) {
            if (newLandscapes.length < 2) {
                if (item.type === 'Way' && newLandscapes.some(l => l.type === 'Way')) {
                    continue; // Skip if it's a Way and we already have one
                }
                newLandscapes.push(item);
            }
        } else { // It's a kingdom card
            if (newKingdom.length < 10) {
                newKingdom.push(item);
            }
        }

        if (newKingdom.length === 10 && newLandscapes.length >= 2) break;
    }

    // This part is for constraint satisfaction, only on kingdom cards
    // The 'newKingdom' array will be mutated by the constraint checks
    let remaining = availableCards.filter(c => !newKingdom.some(s => s.name === c.name));
    let newBaneCard = null;
    let newApproachingArmyCard = null;
    let newExtraPiles = [];
    let remainingForHandlers = [...remaining];

    // --- Handle Special Card Setups that add to the kingdom FIRST ---
    // This ensures their cards are part of the kingdom for subsequent checks.
    const youngWitchResult = handleYoungWitch(newKingdom, remainingForHandlers);
    newKingdom = youngWitchResult.newKingdom;
    newBaneCard = youngWitchResult.newBaneCard;
    remainingForHandlers = youngWitchResult.remaining;

    const ferrymanResult = handleFerryman(newKingdom, newExtraPiles, remainingForHandlers);
    newExtraPiles = ferrymanResult.newExtraPiles;
    remainingForHandlers = ferrymanResult.remaining;

    const riverboatResult = handleRiverboat(newKingdom, newExtraPiles, remainingForHandlers);
    newExtraPiles = riverboatResult.newExtraPiles;
    remainingForHandlers = riverboatResult.remaining;
    // Define the full kingdom for constraint checking
    const fullKingdom = [...newKingdom, ...newExtraPiles.map(p => p.card)];

    // Helper to check if a card is "load-bearing" for any requirement
    const isLoadBearing = (card, currentKingdom) => {
      // Check potion requirement
      if (minPotion > 0 && card.costPotion) {
        if (currentKingdom.filter(c => c.costPotion).length <= minPotion) {
          return true;
        }
      }
      // Check complexity requirement
      const { minCardsBelowComplexity, minComplexityLevel } = userConfig;
      if (minCardsBelowComplexity > 0 && (card.poolLevel || 1) <= minComplexityLevel) {
          const count = currentKingdom.filter(c => (c.poolLevel || 1) <= minComplexityLevel).length;
          if (count <= minCardsBelowComplexity) {
              return true;
          }
      }
      // Check other requirements
      for (const [attr, opt] of Object.entries({
        isDrawer: 'requireDrawer',
        isTrashing: 'requireTrashing',
        isActionSupplier: 'requireActions',
        isBuySupplier: 'requireBuy',
      })) {
        if (selectedOptions[opt] && card[attr]) {
          if (currentKingdom.filter(c => c[attr]).length === 1) {
            return true;
          }
        }
      }
      return false;
    };

    // Check options and replace if needed
    const checkAndReplace = (attribute, option) => {
      if (!selectedOptions[option]) return;
      if (fullKingdom.some(c => c[attribute])) return;

      // Find a card to replace that is not load-bearing
      let replaced = false;
      for (let i = 0; i < newKingdom.length; i++) {
        const cardToReplace = newKingdom[i];
        if (isLoadBearing(cardToReplace, newKingdom)) continue;

        // Find a random replacement from the remaining pool
        const potentialReplacements = remainingForHandlers.filter(c => c[attribute]);
        if (potentialReplacements.length > 0) {
          const idx = Math.floor(Math.random() * potentialReplacements.length);
          const newCard = potentialReplacements[idx];

          // Perform the swap
          newKingdom[i] = newCard;
          remainingForHandlers = remainingForHandlers.filter(c => c.name !== newCard.name);
          remainingForHandlers.push(cardToReplace);
          replaced = true;
          break;
        }
      }

      if (!replaced) {
        console.warn(`Could not find a non-load-bearing card to replace to satisfy the "${option}" requirement.`);
      }
    };

    // Handle Complexity Constraint
    const { minCardsBelowComplexity, minComplexityLevel } = userConfig;
    const currentComplexityCount = fullKingdom.filter(c => (c.poolLevel || 1) <= minComplexityLevel).length;
    
    if (minCardsBelowComplexity > 0 && currentComplexityCount < minCardsBelowComplexity) {
        const needed = minCardsBelowComplexity - currentComplexityCount;
        let availableLowComplexity = remainingForHandlers.filter(c => (c.poolLevel || 1) <= minComplexityLevel);
        
        for (let i = 0; i < needed; i++) {
             if (availableLowComplexity.length === 0) {
                console.warn(`Not enough cards with complexity <= ${minComplexityLevel}.`);
                break;
            }
            
            // Find a card to replace that is NOT load bearing and does NOT satisfy the condition (is high complexity)
            const replacementIndex = newKingdom.findIndex(card => 
                (card.poolLevel || 1) > minComplexityLevel && 
                !isLoadBearing(card, newKingdom)
            );
            
            if (replacementIndex !== -1) {
                const cardToReplace = newKingdom[replacementIndex];
                const idx = Math.floor(Math.random() * availableLowComplexity.length);
                const newCard = availableLowComplexity[idx];
                
                newKingdom[replacementIndex] = newCard;
                remainingForHandlers.push(cardToReplace);
                remainingForHandlers = remainingForHandlers.filter(c => c.name !== newCard.name);
                availableLowComplexity.splice(idx, 1);
            } else {
                console.warn("Could not find suitable card to replace for complexity constraint.");
                break;
            }
        }
    }

    // Run constraint checks
    checkAndReplace('isDrawer', 'requireDrawer');
    checkAndReplace('isTrashing', 'requireTrashing');
    checkAndReplace('isActionSupplier', 'requireActions');
    checkAndReplace('isBuySupplier', 'requireBuy');

    // After other constraints are met, handle the conditional min-potion rule
    const currentPotionCount = fullKingdom.filter(c => c.costPotion).length;
    if (currentPotionCount > 0 && currentPotionCount < minPotion) {
        const potionsNeeded = minPotion - currentPotionCount;
        let availablePotions = remainingForHandlers.filter(c => c.costPotion);

        for (let i = 0; i < potionsNeeded; i++) {
            if (availablePotions.length === 0) {
                console.warn(`Not enough available potion cards to meet the minimum of ${minPotion}.`);
                break;
            }

            // Find a non-potion, non-load-bearing card to replace
            const replacementIndex = newKingdom.findIndex(card => !card.costPotion && !isLoadBearing(card, newKingdom));

            if (replacementIndex !== -1) {
                const cardToReplace = newKingdom[replacementIndex];
                
                // Pick a random available potion card
                const potionIdx = Math.floor(Math.random() * availablePotions.length);
                const newPotionCard = availablePotions[potionIdx];

                // Swap
                newKingdom[replacementIndex] = newPotionCard;
                remainingForHandlers.push(cardToReplace);
                remainingForHandlers = remainingForHandlers.filter(c => c.name !== newPotionCard.name);
                availablePotions.splice(potionIdx, 1);
            } else {
                console.warn("Could not find a non-load-bearing card to replace for the potion requirement.");
                break; // No swappable cards left
            }
        }
    }

    // --- Handle Landscapes that depend on kingdom cards (Ally/Prophecy) ---

    // Check for Liaison and add an Ally if not already present
    const hasLiaison = [...newKingdom, ...newExtraPiles.map(p => p.card), newBaneCard].filter(Boolean).some(card => card.isLiaison);
    const hasAlly = newLandscapes.some(l => l.type === 'Ally');
    if (hasLiaison && !hasAlly && potentialAllies.length > 0) {
        const idx = Math.floor(Math.random() * potentialAllies.length);
        newLandscapes.push(potentialAllies[idx]);
    }

    // Check for Omen and add a Prophecy if not already present
    const hasOmen = [...newKingdom, ...newExtraPiles.map(p => p.card), newBaneCard].filter(Boolean).some(card => card.isOmen);
    const hasProphecy = newLandscapes.some(l => l.type === 'Prophecy');
    if (hasOmen && !hasProphecy && potentialProphecies.length > 0) {
        const idx = Math.floor(Math.random() * potentialProphecies.length);
        newLandscapes.push(potentialProphecies[idx]);
    }

    // --- Handle Landscapes that add cards to the kingdom (AFTER landscapes are finalized) ---
    const aaResult = handleApproachingArmy(newLandscapes, newKingdom, remainingForHandlers);
    newKingdom = aaResult.newKingdom;
    newApproachingArmyCard = aaResult.newAttackCard;
    remainingForHandlers = aaResult.remaining;

    // If Approaching Army added Young Witch, we need to add a Bane.
    if (newApproachingArmyCard?.name === 'Young Witch') {
        const ywBaneResult = handleYoungWitch(newKingdom, remainingForHandlers, true);
        newBaneCard = ywBaneResult.newBaneCard; // This will overwrite the previous null bane card
    }

    // Handle Traits
    const traits = newLandscapes.filter(l => l.type === 'Trait');
    const newAssignedTraits = [];
    let availableTraitTargets = newKingdom.filter(c => c.isAction || c.isTreasure);

    for (const trait of traits) {
        if (availableTraitTargets.length > 0) {
            const targetIndex = Math.floor(Math.random() * availableTraitTargets.length);
            const randomTarget = availableTraitTargets[targetIndex];
            newAssignedTraits.push({ cardName: randomTarget.name, traitName: trait.name });
            // Remove the card from the pool so it can't get another trait
            availableTraitTargets.splice(targetIndex, 1);
        }
    }
    setUserConfig(prev => ({ ...prev, assignedTraits: newAssignedTraits }));

    setKingdom(newKingdom);
    setBaneCard(newBaneCard);
    setApproachingArmyCard(newApproachingArmyCard);
    setExtraPiles(newExtraPiles);
    setLandscapes(newLandscapes);
    setSelectedItem(null);
    };

    // --- Special Card Setup Handlers ---

    const handleYoungWitch = (currentKingdom, currentRemaining, isFromApproachingArmy = false) => {
        let newBaneCard = null;
        if (isFromApproachingArmy || currentKingdom.some(c => c.name === 'Young Witch')) {
            const potentialBaneCards = currentRemaining.filter(c => (c.cost === 2 || c.cost === 3) && !c.costPotion);
            if (potentialBaneCards.length > 0) {
                const baneIndex = Math.floor(Math.random() * potentialBaneCards.length);
                newBaneCard = potentialBaneCards[baneIndex];
                const newKingdom = [...currentKingdom, newBaneCard];
                const newRemaining = currentRemaining.filter(c => c.name !== newBaneCard.name);
                return { newKingdom, newBaneCard, remaining: newRemaining };
            } else {
                console.warn("Young Witch is in the kingdom, but no valid Bane card could be found.");
            }
        }
        return { newKingdom: currentKingdom, newBaneCard, remaining: currentRemaining }; // Always return the original kingdom
    };

    const handleFerryman = (currentKingdom, currentExtraPiles, currentRemaining) => {
        if (currentKingdom.some(c => c.name === 'Ferryman')) {
            const potentialTargets = currentRemaining.filter(c => (c.cost === 3 || c.cost === 4));
            if (potentialTargets.length > 0) {
                const targetIndex = Math.floor(Math.random() * potentialTargets.length);
                const targetCard = potentialTargets[targetIndex];
                currentExtraPiles.push({ card: targetCard, reason: 'Ferryman' }); // This mutates, which is fine here.
                currentRemaining.splice(currentRemaining.findIndex(c => c.name === targetCard.name), 1);
            } else {
                console.warn("Ferryman is in the kingdom, but no valid target card could be found.");
            }
        }
        return { newExtraPiles: currentExtraPiles, remaining: currentRemaining };
    };

    const handleRiverboat = (currentKingdom, currentExtraPiles, currentRemaining) => {
        if (currentKingdom.some(c => c.name === 'Riverboat')) {
            const potentialTargets = currentRemaining.filter(c => c.isAction && !c.isDuration && c.cost === 5);
            if (potentialTargets.length > 0) {
                const targetIndex = Math.floor(Math.random() * potentialTargets.length);
                const targetCard = potentialTargets[targetIndex];
                currentExtraPiles.push({ card: targetCard, reason: 'Riverboat' }); // This mutates, which is fine here.
                currentRemaining.splice(currentRemaining.findIndex(c => c.name === targetCard.name), 1);
            } else {
                console.warn("Riverboat is in the kingdom, but no valid target card could be found.");
            }
        }
        return { newExtraPiles: currentExtraPiles, remaining: currentRemaining };
    };

    const handleApproachingArmy = (currentLandscapes, currentKingdom, currentRemaining) => {
        let newAttackCard = null;
        const isApproachingArmyPresent = currentLandscapes.some(l => l.name === 'Approaching Army');
        if (isApproachingArmyPresent) {
            const potentialTargets = currentRemaining.filter(c => c.isAttack);
            if (potentialTargets.length > 0) {
                const targetIndex = Math.floor(Math.random() * potentialTargets.length);
                newAttackCard = potentialTargets[targetIndex];
                const newKingdom = [...currentKingdom, newAttackCard];
                const newRemaining = currentRemaining.filter(c => c.name !== newAttackCard.name);
                return { newKingdom, newAttackCard, remaining: newRemaining };
            } else {
                console.warn("Approaching Army is in the kingdom, but no valid Attack card could be found.");
            }
        }
        return { newKingdom: currentKingdom, newAttackCard, remaining: currentRemaining };
    };

    const handleCardRemovalSideEffects = (removedCard, currentKingdom, currentLandscapes, currentBaneCard, currentApproachingArmyCard, currentExtraPiles) => {
        let newKingdom = [...currentKingdom];
        let newLandscapes = [...currentLandscapes];
        let newBaneCard = currentBaneCard;
        let newApproachingArmyCard = currentApproachingArmyCard;
        let newExtraPiles = [...currentExtraPiles];

        // --- Direct removal of associated cards/piles if the source card is removed ---
        // If the removed card was Young Witch, remove its Bane
        // Note: Bane is not part of the kingdom array, it's separate.
        // If the removed card was Young Witch, and there isn't another YW, remove its Bane
        if (removedCard.name === 'Young Witch' && !currentKingdom.some(c => c.name === 'Young Witch' && c.name !== removedCard.name)) {
            newBaneCard = null;
        }
        // If the removed card was Ferryman, remove its extra pile
        if (removedCard.name === 'Ferryman') {
            newExtraPiles = newExtraPiles.filter(p => p.reason !== 'Ferryman');
        }
        // If the removed card was Riverboat, remove its extra pile
        if (removedCard.name === 'Riverboat') {
            newExtraPiles = newExtraPiles.filter(p => p.reason !== 'Riverboat');
        }
        
        // If the removed card was the attack card for Approaching Army, remove the landscape too
        if (newApproachingArmyCard && removedCard.name === newApproachingArmyCard.name) {            
            newLandscapes = newLandscapes.filter(l => l.name !== 'Approaching Army');
            newApproachingArmyCard = null;
        }

        // If the removed card was the Approaching Army landscape, remove its attack card
        if (removedCard.name === 'Approaching Army' && newApproachingArmyCard) {
            newKingdom = newKingdom.filter(c => c.name !== newApproachingArmyCard.name);
            newLandscapes = newLandscapes.filter(l => l.name !== 'Approaching Army');
        }

        // If the removed card was an extra pile card (Ferryman/Riverboat target)
        const removedExtraPile = newExtraPiles.find(p => p.card.name === removedCard.name);
        if (removedExtraPile) {
            newExtraPiles = newExtraPiles.filter(p => p.card.name !== removedCard.name);
        }

        // --- Indirect removal of Ally/Prophecy based on remaining cards ---
        const fullSupplyAfterRemoval = [
            ...newKingdom.filter(c => c.name !== removedCard.name),
            ...newExtraPiles.map(p => p.card),
            newBaneCard
        ].filter(Boolean);

        // Check if the last Liaison was removed
        const wasLastLiaison = removedCard.isLiaison && !fullSupplyAfterRemoval.some(c => c.isLiaison);
        if (wasLastLiaison) {
            newLandscapes = newLandscapes.filter(l => l.type !== 'Ally');
        }

        // Check if the last Omen was removed
        const wasLastOmen = removedCard.isOmen && !fullSupplyAfterRemoval.some(c => c.isOmen);
        if (wasLastOmen) {
            newLandscapes = newLandscapes.filter(l => l.type !== 'Prophecy');
        }

        if (!newLandscapes.some(l => l.name === 'Approaching Army') && newApproachingArmyCard) {
            newKingdom = newKingdom.filter(c => c.name !== newApproachingArmyCard.name);
            newApproachingArmyCard = null;
        }

        return { newKingdom, newLandscapes, newBaneCard, newApproachingArmyCard, newExtraPiles };
    };


    const replaceItem = () => {
        if (!selectedItem) return;

        // Check if the selected item is a landscape
        const isLandscape = allAvailableLandscapes.some(l => l.name === selectedItem.name) ||
                              allAvailableAllies.some(l => l.name === selectedItem.name) ||
                              allAvailableProphecies.some(l => l.name === selectedItem.name);

        const fullKingdomWithExtras = [...kingdom, baneCard, ...extraPiles.map(p => p.card)].filter(Boolean);
        const available = getAvailablePool().cards.filter(c => !fullKingdomWithExtras.some(k => k.name === c.name));

        // --- Handle replacing SPECIAL cards (Bane, AA Attack, Extra Piles) ---

        // Handle replacing the Bane card
        if (baneCard && selectedItem.name === baneCard.name) {
            const potentialReplacements = available.filter(c => (c.cost === 2 || c.cost === 3) && !c.costPotion);
            if (potentialReplacements.length === 0) {
                alert("No valid replacement for the Bane card could be found (must cost $2 or $3).");
                return;
            }
            const newBaneCard = potentialReplacements[Math.floor(Math.random() * potentialReplacements.length)];
            setBaneCard(newBaneCard);
            setSelectedItem(null);
            return;
        }

        // Handle replacing the Approaching Army card
        if (approachingArmyCard && selectedItem.name === approachingArmyCard.name) {
            const potentialReplacements = available.filter(c => c.isAttack);
            if (potentialReplacements.length === 0) {
                alert("No valid replacement for the Approaching Army card could be found (must be an Attack card).");
                return;
            }
            const newAttackCard = potentialReplacements[Math.floor(Math.random() * potentialReplacements.length)];
            setApproachingArmyCard(newAttackCard);
            setSelectedItem(null);
            return;
        }

        // Handle replacing extra piles (Ferryman, Riverboat)
        const extraPile = extraPiles.find(p => p.card.name === selectedItem.name);
        if (extraPile) {
            let potentialReplacements = [];
            let alertMessage = "";

            if (extraPile.reason === 'Ferryman') {
                potentialReplacements = available.filter(c => c.cost === 3 || c.cost === 4);
                alertMessage = "No valid replacement for the Ferryman pile could be found (must cost $3 or $4).";
            } else if (extraPile.reason === 'Riverboat') {
                potentialReplacements = available.filter(c => c.isAction && !c.isDuration && c.cost === 5);
                alertMessage = "No valid replacement for the Riverboat pile could be found (must be a non-Duration Action costing $5).";
            }

            if (potentialReplacements.length === 0) {
                alert(alertMessage);
                return;
            }

            const newCard = potentialReplacements[Math.floor(Math.random() * potentialReplacements.length)];
            setExtraPiles(extraPiles.map(p => 
                p.card.name === selectedItem.name 
                ? { ...p, card: newCard } 
                : p
            ));
            setSelectedItem(null);
            return;
        }

        if (isLandscape) {
            const { landscapes: availableLandscapesPool, allies: availableAllies, prophecies: availableProphecies } = getAvailablePool();
            const currentLandscapeNames = landscapes.map(l => l.name);

            let replacementPool;
            if (selectedItem.type === 'Ally') {
                replacementPool = availableAllies;
            } else if (selectedItem.type === 'Prophecy') {
                replacementPool = availableProphecies;
            } else {
                // For all other landscape types, use the main pool but filter by type
                replacementPool = availableLandscapesPool.filter(l => l.type === selectedItem.type);
            }

            // Find a replacement that is not already in the kingdom
            const potentialReplacements = replacementPool.filter(l => 
                !currentLandscapeNames.includes(l.name)
            );

            if (potentialReplacements.length === 0) {
                alert(`No available replacements for this ${selectedItem.type}.`);
                return;
            }

            const replacement = potentialReplacements[Math.floor(Math.random() * potentialReplacements.length)];
            
            let newLandscapes = landscapes.map(l => l.name === selectedItem.name ? replacement : l);
            let newKingdom = [...kingdom];
            let newBane = baneCard;
            let newApproachingArmyCard = approachingArmyCard;

            // Handle side-effects of removing the old landscape
            if (selectedItem.name === 'Approaching Army' && approachingArmyCard) {
                // If the AA card was Young Witch, also remove its bane
                if (approachingArmyCard.name === 'Young Witch') {
                    newBane = null;
                }
                newApproachingArmyCard = null;
            }

            // Handle side-effects of adding the new landscape
            if (replacement.name === 'Approaching Army') {
                const { cards: availableCards } = getAvailablePool();
                const fullKingdomWithExtras = [...kingdom, baneCard, ...extraPiles.map(p => p.card)].filter(Boolean);
                const remainingForHandlers = availableCards.filter(c => !fullKingdomWithExtras.some(k => k.name === c.name));

                const result = handleApproachingArmy(newLandscapes, [], remainingForHandlers);
                newKingdom.push(result.newAttackCard);
                newApproachingArmyCard = result.newAttackCard;
            }

            setLandscapes(newLandscapes);
            setKingdom(newKingdom);
            setApproachingArmyCard(newApproachingArmyCard);
            setSelectedItem(null);
            return;
        }

        // --- Logic for replacing a KINGDOM CARD ---

        if (available.length === 0) {
            alert('No kingdom cards available to replace with!');
            return;
        }

        // --- Default logic for replacing a regular kingdom card ---
        const isCardLoadBearing = (card, currentKingdom) => {
            if (minPotion > 0 && card.costPotion) {
                if (currentKingdom.filter(c => c.costPotion).length <= minPotion) return true;
            }
            // Complexity check
            const { minCardsBelowComplexity, minComplexityLevel } = userConfig;
            if (minCardsBelowComplexity > 0 && (card.poolLevel || 1) <= minComplexityLevel) {
                const count = currentKingdom.filter(c => (c.poolLevel || 1) <= minComplexityLevel).length;
                if (count <= minCardsBelowComplexity) return true;
            }
            for (const [attr, opt] of Object.entries({
                isDrawer: 'requireDrawer',
                isTrashing: 'requireTrashing',
                isActionSupplier: 'requireActions',
                isBuySupplier: 'requireBuy',
            })) {
                if (selectedOptions[opt] && card[attr]) {
                    if (currentKingdom.filter(c => c[attr]).length === 1) return true;
                }
            }
            return false;
        };

        // Check if the selected card is load-bearing for any required attribute
        const requiredAttributes = Object.entries(selectedOptions)
            .filter(([opt, val]) => val && isCardLoadBearing(selectedItem, kingdom))
            .map(([opt]) => ({'requireDrawer': 'isDrawer', 'requireTrashing': 'isTrashing', 'requireActions': 'isActionSupplier', 'requireBuy': 'requireBuy'}[opt]));

        // Check complexity requirement specifically
        const { minCardsBelowComplexity, minComplexityLevel } = userConfig;
        let requiresLowComplexity = false;
        if (minCardsBelowComplexity > 0) {
             const count = fullKingdomWithExtras.filter(c => (c.poolLevel || 1) <= minComplexityLevel).length;
             const isRemovingLow = (selectedItem.poolLevel || 1) <= minComplexityLevel;
             const projectedCount = count - (isRemovingLow ? 1 : 0);
             
             if (projectedCount < minCardsBelowComplexity) {
                 requiresLowComplexity = true;
             }
        }

        let replacement;
        // Filter out landscapes from potential replacements for kingdom cards
        const validReplacements = available.filter(c => !allAvailableLandscapes.some(l => l.name === c.name));
        if (requiredAttributes.length > 0 || requiresLowComplexity) {
            const potentialReplacements = validReplacements.filter(c => 
                requiredAttributes.every(attr => c[attr]) &&
                (!requiresLowComplexity || (c.poolLevel || 1) <= minComplexityLevel)
            );

            if (potentialReplacements.length === 0) {
                alert(`No replacement cards available with required attributes: ${requiredAttributes.join(', ')}`);
                return;
            }
            
            // Pick a random one from the potential replacements
            const idx = Math.floor(Math.random() * potentialReplacements.length);
            replacement = potentialReplacements[idx];
        } else {
            if (validReplacements.length === 0) {
                alert('No valid kingdom cards available to replace with!');
                return;
            }
            const idx = Math.floor(Math.random() * validReplacements.length);
            replacement = validReplacements[idx];
        }

        let newKingdom = kingdom.map(c => c.name === selectedItem.name ? replacement : c);
        let newBane = baneCard;
        let newApproachingArmyCard = approachingArmyCard;
        let newExtras = extraPiles;
        let remainingForHandlers = available.filter(c => c.name !== replacement.name);

        // --- Handle side-effects of REMOVING the selected card (before adding new one) ---
        const removalEffects = handleCardRemovalSideEffects(selectedItem, kingdom, landscapes, baneCard, approachingArmyCard, extraPiles);
        newKingdom = removalEffects.newKingdom;
        let newLandscapes = removalEffects.newLandscapes;
        newBane = removalEffects.newBaneCard;
        newApproachingArmyCard = removalEffects.newApproachingArmyCard;
        newExtras = removalEffects.newExtraPiles;

        // Replace the card in the (potentially modified) kingdom
        newKingdom = newKingdom.map(c => c.name === selectedItem.name ? replacement : c);

        // Add the removed card back to the pool for new handlers
        remainingForHandlers.push(selectedItem);
        if (selectedItem.name === 'Young Witch' && baneCard) remainingForHandlers.push(baneCard);
        if (selectedItem.name === 'Approaching Army' && approachingArmyCard) remainingForHandlers.push(approachingArmyCard);

        // After swapping, check if the new card requires a setup action
        if (replacement.name === 'Young Witch') {
            const ywResult = handleYoungWitch(newKingdom, remainingForHandlers);
            newBane = ywResult.newBaneCard;
            remainingForHandlers = ywResult.remaining;
        } else if (replacement.name === 'Ferryman') {
            ({ newExtraPiles: newExtras, remaining: remainingForHandlers } = handleFerryman(newKingdom, newExtras, remainingForHandlers)); // Mutates newExtras
        } else if (replacement.name === 'Riverboat') {
            ({ newExtraPiles: newExtras, remaining: remainingForHandlers } = handleRiverboat(newKingdom, newExtras, remainingForHandlers));
        }

        setKingdom(newKingdom);
        setBaneCard(newBane);
        setApproachingArmyCard(newApproachingArmyCard);
        setLandscapes(newLandscapes);
        setExtraPiles(newExtras);
        setSelectedItem(null);
    };

    // Combine all cards for display
    const displayCards = [
        ...kingdom,
        ...(baneCard ? [baneCard] : []),
        ...(approachingArmyCard ? [approachingArmyCard] : [])
    ].filter((v, i, a) => a.findIndex(t => (t.name === v.name)) === i); // Remove duplicates

    const sortedKingdom = sortKingdom(displayCards);

    const CardBox = ({ card, onClick, isSelected, traitName, isBane, markerText }) => {
        const activeBanners = [
            traitName && { text: traitName, color: 'bg-purple-600' },
            markerText && { text: markerText, color: 'bg-blue-600' },
            isBane && { text: 'Bane', color: 'bg-red-600' }
        ].filter(Boolean);

        const marginClass = activeBanners.length === 0 ? '' : activeBanners.length === 1 ? 'mb-6' : activeBanners.length === 2 ? 'mb-11' : 'mb-16';

        return (
        <div
        onClick={onClick ? () => onClick(card) : null}
        className={`${getCardBackground(card)} rounded-lg p-3 cursor-pointer transition-all flex flex-col justify-between ${
            isSelected ? 'ring-4 ring-blue-600 transform scale-105' : (onClick ? 'hover:shadow-lg' : '')
        } relative`}
        >
            <div>
                <div className="flex justify-between items-start">
                    <div className="flex items-center gap-1 flex-shrink-0">
                        {card.costDebt > 0 ? (
                            <div className="relative w-8 h-9 flex items-center justify-center">
                                <HexagonIcon className="w-full h-full text-red-600" />
                                <span className="absolute font-bold text-sm text-white">{card.costDebt}</span>
                            </div>
                        ) : (
                            <div className="bg-yellow-500 rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm">
                                {card.cost}
                            </div>
                        )}
                        {card.costPotion && <PotionIcon className="w-5 h-5 text-blue-800" />}
                    </div>

                    <div className="font-semibold text-sm leading-tight text-gray-900 text-right ml-2">{card.name}</div>
                </div>
            </div>
            <div className={`text-right mt-2 ${marginClass}`}>
                <div className="text-xs text-gray-800 opacity-70 italic">{card.set}</div>
                <div className="text-xs text-gray-800 opacity-70">Lvl {card.poolLevel || 1}</div>
            </div>
            {activeBanners.length > 0 && (
                <div className="absolute bottom-0 left-0 right-0 flex flex-col">
                    {activeBanners.map((banner, index) => (
                        <div 
                            key={index}
                            className={`${banner.color} text-white text-xs font-bold text-center py-0.5 ${index === activeBanners.length - 1 ? 'rounded-b-md' : ''}`}
                        >
                            {banner.text}
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
    };

    const LandscapeBox = ({ landscape, type, onClick, isSelected }) => {
        const colorMap = {
            'Ally': 'bg-pink-200',
            'Event': 'bg-blue-200',
            'Prophecy': 'bg-purple-200',
            'Landmark': 'bg-green-200',
            'Project': 'bg-yellow-200',
            'Way': 'bg-orange-200',
            'Trait': 'bg-purple-300',
        };
        return (
            <div 
                onClick={onClick ? () => onClick(landscape) : null}
                className={`${colorMap[type]} rounded-lg p-3 flex flex-col justify-between transition-all ${
                    isSelected ? 'ring-4 ring-blue-600 transform scale-105' : (onClick ? 'hover:shadow-lg cursor-pointer' : '')
                }`}
            >
                <div>
                    <div className="font-semibold text-sm leading-tight text-gray-900">{landscape.name}</div>
                    <div className="text-xs text-gray-700">{type}</div>
                </div>
                <div className="text-right mt-2">
                    <div className="text-xs text-gray-800 opacity-70 italic">{landscape.set}</div>
                    <div className="text-xs text-gray-800 opacity-70">Lvl {landscape.poolLevel || 1}</div>
                </div>
            </div>
        );
    };

    return (
        <div className="min-h-screen bg-gray-100">
        {/* Header */}
        <header className="bg-white shadow-sm border-b">
            <div className="max-w-7xl mx-auto px-4 py-4">
            <div className="flex justify-between items-center">
                <div>
                <h1 className="text-2xl md:text-3xl font-bold text-teal-600">Dominion Randomizer</h1>
                <p className="text-sm text-gray-600">Dominion card picker for desktop and mobile</p>
                </div>
                <button
                onClick={() => setShowMobileMenu(!showMobileMenu)}
                className="md:hidden p-2"
                >
                <Menu size={24} />
                </button>
                <button
                onClick={() => setShowSettings(!showSettings)}
                className="hidden md:flex items-center gap-2 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
                >
                <Settings size={20} />
                Settings
                </button>
            </div>
            </div>
        </header>

        <div className="max-w-7xl mx-auto px-4 py-6">
            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            {/* Sidebar */}
            <div className="lg:col-span-1">
                <div className="bg-white rounded-lg shadow p-4 lg:sticky lg:top-4">
                <div className="space-y-4">
                    {/* Sets */}
                    <div>
                    <div className="flex justify-between items-center mb-2">
                        <h3 className="font-bold">Sets</h3>
                        <div className="flex gap-2">
                            <button onClick={handleSelectAllSets} className="text-xs text-blue-600 hover:underline">All</button>
                            <button onClick={handleDeselectAllSets} className="text-xs text-blue-600 hover:underline">None</button>
                        </div>
                    </div>
                    <div className="space-y-1 max-h-48 overflow-y-auto pr-2">
                        {allSetNames
                            .filter(setName => ownedSets[setName])
                            .map(setName => (
                            <label key={setName} className="flex items-center gap-2 text-sm">
                                <input
                                    type="checkbox"
                                    checked={selectedSets[setName] || false}
                                    onChange={(e) => setUserConfig(prev => ({ ...prev, selectedSets: { ...prev.selectedSets, [setName]: e.target.checked } }))}
                                />
                                {setName}
                            </label>
                        ))}
                    </div>
                    </div>

                    {/* Mixes */}
                    {allMixes.length > 0 && (
                        <div>
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-bold">Mixes</h3>
                                <div className="flex gap-2">
                                    <button onClick={handleSelectAllMixes} className="text-xs text-blue-600 hover:underline">All</button>
                                    <button onClick={handleDeselectAllMixes} className="text-xs text-blue-600 hover:underline">None</button>
                                </div>
                            </div>
                            <div className="space-y-1 max-h-48 overflow-y-auto pr-2">
                                {allMixes.map(mix => (
                                    <label key={mix.name} className="flex items-center gap-2 text-sm">
                                        <input type="checkbox"
                                            checked={selectedMixes[mix.name] || false}
                                            onChange={(e) => setUserConfig(prev => ({ ...prev, selectedMixes: { ...prev.selectedMixes, [mix.name]: e.target.checked } }))} />
                                        {mix.name}
                                    </label>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Max Pool Level */}
                    <div>
                    <label className="block text-sm font-semibold mb-1">
                        Max Card Pool Level: {maxPoolLevel}
                    </label>
                    <input
                        type="range"
                        min="1"
                        max="10"
                        value={maxPoolLevel}
                        onChange={(e) => {
                            const newPoolLevel = parseInt(e.target.value);
                            setUserConfig(prev => ({
                                ...prev,
                                maxPoolLevel: newPoolLevel,
                                // Reset minPotion if pool level is not 10
                                minPotion: newPoolLevel < 10 ? 0 : prev.minPotion,
                                minComplexityLevel: Math.min(prev.minComplexityLevel, newPoolLevel)
                            }));
                        }}
                        className="w-full"
                    />
                    </div>

                    {/* Complexity Constraint */}
                    <div className="mt-2 p-2 bg-gray-50 rounded border border-gray-200">
                        <label className="block text-xs font-bold mb-2 text-gray-700">
                            At least {userConfig.minCardsBelowComplexity} cards with Max Level {userConfig.minComplexityLevel}
                        </label>
                        
                        <div className="mb-2">
                            <div className="flex justify-between text-xs text-gray-500 mb-1">
                                <span>Cards</span>
                                <span>{userConfig.minCardsBelowComplexity}</span>
                            </div>
                            <input
                                type="range"
                                min="0"
                                max="10"
                                value={userConfig.minCardsBelowComplexity}
                                onChange={(e) => setUserConfig(prev => ({ ...prev, minCardsBelowComplexity: parseInt(e.target.value) }))}
                                className="w-full"
                            />
                        </div>

                        <div>
                            <div className="flex justify-between text-xs text-gray-500 mb-1">
                                <span>Complexity</span>
                                <span>{userConfig.minComplexityLevel}</span>
                            </div>
                            <input
                                type="range"
                                min="1"
                                max={maxPoolLevel}
                                value={userConfig.minComplexityLevel}
                                onChange={(e) => setUserConfig(prev => ({ ...prev, minComplexityLevel: parseInt(e.target.value) }))}
                                className="w-full"
                            />
                        </div>
                    </div>


                    {/* Min Potion */}
                    {maxPoolLevel === 10 && (
                        <div>
                        <label className="block text-sm font-semibold mb-1">
                            Min Potion Cards: {minPotion}
                        </label>
                        <input
                            type="range"
                            min="0"
                            max="10"
                            value={minPotion}
                            onChange={(e) => setUserConfig(prev => ({ ...prev, minPotion: parseInt(e.target.value) }))}
                            className="w-full"
                        />
                        </div>
                    )}

                    {/* Options */}
                    <div>
                    <h3 className="font-bold mb-2">Options</h3>
                    <div className="space-y-1">
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="checkbox"
                            checked={selectedOptions.requireActions || false}
                            onChange={(e) => setUserConfig(prev => ({ ...prev, selectedOptions: { ...prev.selectedOptions, requireActions: e.target.checked } }))}
                        />
                        Require +2 Action
                        </label>
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="checkbox"
                            checked={selectedOptions.requireDrawer || false}
                            onChange={(e) => setUserConfig(prev => ({ ...prev, selectedOptions: { ...prev.selectedOptions, requireDrawer: e.target.checked } }))}
                        />
                        Require Drawer
                        </label>
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="checkbox"
                            checked={selectedOptions.requireBuy || false}
                            onChange={(e) => setUserConfig(prev => ({ ...prev, selectedOptions: { ...prev.selectedOptions, requireBuy: e.target.checked } }))}
                        />
                        Require Buy
                        </label>
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="checkbox"
                            checked={selectedOptions.requireTrashing || false}
                            onChange={(e) => setUserConfig(prev => ({ ...prev, selectedOptions: { ...prev.selectedOptions, requireTrashing: e.target.checked } }))}
                        />
                        Require Trashing
                        </label>
                    </div>
                    </div>

                    {/* Sort */}
                    <div>
                    <h3 className="font-bold mb-2">Sort</h3>
                    <div className="space-y-1">
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="radio"
                            checked={sortBy === 'set'}
                            onChange={() => setUserConfig(prev => ({ ...prev, sortBy: 'set' }))}
                        />
                        Set
                        </label>
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="radio"
                            checked={sortBy === 'alphabetical'}
                            onChange={() => setUserConfig(prev => ({ ...prev, sortBy: 'alphabetical' }))}
                        />
                        Alphabetical
                        </label>
                        <label className="flex items-center gap-2 text-sm">
                        <input
                            type="radio"
                            checked={sortBy === 'cost'}
                            onChange={() => setUserConfig(prev => ({ ...prev, sortBy: 'cost' }))}
                        />
                        Cost
                        </label>
                    </div>
                    </div>
                </div>
                </div>
            </div>

            {/* Main Content */}
            <div className="lg:col-span-3">
                <button
                    onClick={selectedItem ? replaceItem : randomizeKingdom}
                    className="w-full bg-teal-500 text-white py-3 rounded-lg font-semibold hover:bg-teal-600 mb-6"
                >
                    {selectedItem ? 'Replace' : 'Randomize!'}
                </button>
                {kingdom.length === 0 ? (
                <div className="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                    Click "Randomize!" to generate a kingdom
                </div>
                ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                    {sortedKingdom.map((card, idx) => (
                    <CardBox
                        key={card.name}
                        card={card}
                        onClick={handleItemClick}
                        isSelected={selectedItem?.name === card.name}
                        traitName={userConfig.assignedTraits?.find(t => t.cardName === card.name)?.traitName}
                        markerText={approachingArmyCard?.name === card.name ? 'Approaching Army' : null}
                        isBane={baneCard?.name === card.name}
                    />
                    ))}
                    {extraPiles.map(pile => (
                        <CardBox
                            key={pile.card.name}
                            card={pile.card}
                            onClick={handleItemClick}
                            isSelected={selectedItem?.name === pile.card.name}
                            markerText={pile.reason}
                        />
                    ))}
                    {landscapes.map(l => (
                        <LandscapeBox 
                            key={l.name} 
                            landscape={l} 
                            type={l.type} 
                            onClick={handleItemClick}
                            isSelected={selectedItem?.name === l.name} />
                ))}
                </div>
                )}
            </div>
            </div>
        </div>

        {/* Settings Modal */}
        {showSettings && (
            <div className="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div className="p-6">
                <div className="flex justify-between items-center mb-4">
                    <h2 className="text-2xl font-bold">Settings</h2>
                    <button onClick={() => setShowSettings(false)}>
                    <X size={24} />
                    </button>
                </div>

                {/* Owned Sets */}
                <div className="mb-6">
                    <div className="flex justify-between items-center mb-2">
                        <div>
                            <h3 className="font-bold text-lg">Owned Sets</h3>
                            <p className="text-sm text-gray-600">Uncheck sets you don't own to hide them from the main list.</p>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleSelectAllOwned} className="text-sm text-blue-600 hover:underline">All</button>
                            <button onClick={handleDeselectAllOwned} className="text-sm text-blue-600 hover:underline">None</button>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                        {allSetNames.map(setName => (
                            <label key={setName} className="flex items-center gap-2 text-sm">
                                <input
                                    type="checkbox"
                                    checked={ownedSets[setName] || false}
                                    onChange={(e) => setOwnedSets({ ...ownedSets, [setName]: e.target.checked })}
                                />
                                {setName}
                            </label>
                        ))}
                    </div>
                </div>

                {/* Ban Cards */}
                <div>
                    <h3 className="font-bold mb-2 text-lg">Randomize Constraints</h3>
                    <p className="text-sm text-gray-600 mb-3">Remove cards from randomizer selection</p>
                    <div className="space-y-2">
                    {[
                        ...allAvailableCards, ...allAvailableLandscapes
                    ].sort((a,b) => a.name.localeCompare(b.name)).map(card => (
                        <div key={card.name} className="flex items-center justify-between py-1">
                        <span className="text-sm">{card.name}</span>
                        <label className="flex items-center gap-2">
                            <input
                            type="checkbox"
                            checked={bannedCards[card.name] || false}
                            onChange={(e) => setBannedCards({ ...bannedCards, [card.name]: e.target.checked })}
                            />
                            <span className="text-xs text-gray-600">Ban</span>
                        </label>
                        </div>
                    ))}
                    </div>
                </div>
                </div>
            </div>
            </div>
        )}
        </div>
    );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
